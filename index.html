<script type="module">

const SUPABASE_URL = "https://ukmhhpbnyjsgfmsmtiup.supabase.co";

const API_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVrbWhocGJueWpzZ2Ztc210aXVwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ2Nzg1NTgsImV4cCI6MjExMDI1NDU1OH0.ejrob-raOUdWAuuHxmLpbgPvWMyIW4paBQGp8zcAYds";

let VIDEOS = [];
let SERIES = [];

let currentPage = 1;

const ITEMS_PER_PAGE = 30;

const list = document.getElementById("list");
const pagination = document.getElementById("pagination");


// HTML ESCAPE

function escapeHtml(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


// IMAGE URL

function safeImage(url){
  try{
    const parsed = new URL(url);
    if(parsed.protocol === "https:" || parsed.protocol === "http:"){
      return parsed.href;
    }
  }catch(e){}

  return "";
}


// =====================================
// GROUP VIDEOS INTO SERIES
// =====================================

function groupSeries(){

  const groups = {};

  VIDEOS.forEach(video => {

    // Series title available in new database
    const seriesName = (
      video.series_title ||
      video.title ||
      "Untitled"
    ).trim();

    if(!groups[seriesName]){
      groups[seriesName] = {
        series_title: seriesName,
        episodes: [],
        total_views: 0,
        latest_date: 0,
        oldest_date: Infinity
      };
    }

    const group = groups[seriesName];

    group.episodes.push(video);

    group.total_views += Number(video.views || 0);

    const date = new Date(video.created_at).getTime() || 0;

    group.latest_date = Math.max(group.latest_date,date);

    group.oldest_date = Math.min(group.oldest_date,date);

  });


  SERIES = Object.values(groups).map(group => {

    // Episode number ke according sorting
    group.episodes.sort((a,b) => {

      const epA = Number(a.episode_number || 999999);
      const epB = Number(b.episode_number || 999999);

      return epA - epB;

    });


    // First episode select
    let firstEpisode = group.episodes.find(
      ep => Number(ep.episode_number) === 1
    );

    // Legacy videos without episode_number
    if(!firstEpisode){
      firstEpisode = group.episodes[0];
    }

    return {
      ...group,
      firstEpisode: firstEpisode
    };

  });

}


// =====================================
// FETCH FROM SUPABASE
// =====================================

async function fetchVideos(){

  list.innerHTML = "<p>Loading videos...</p>";

  try{

    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/videos?select=*&order=created_at.desc&limit=1000`,
      {
        headers:{
          "apikey":API_KEY,
          "Authorization":`Bearer ${API_KEY}`
        }
      }
    );

    if(!res.ok){
      throw new Error(await res.text());
    }

    const data = await res.json();

    VIDEOS = data;

    groupSeries();

    currentPage = 1;

    render("recent");

  }catch(error){

    console.error("Supabase Error:",error);

    list.innerHTML = "<p>Unable to load videos. Please try again.</p>";

  }

}


// =====================================
// SHARE SERIES
// =====================================

window.shareVideo = async function(seriesName){

  const series = SERIES.find(
    s => s.series_title === seriesName
  );

  if(!series || !series.firstEpisode){
    return alert("Video not found!");
  }

  const video = series.firstEpisode;

  const url = `${window.location.origin}/Watch.html?id=${video.id}`;

  const title = series.series_title;

  const shareData = {
    title:title,
    text:`${title}\n${url}`
  };

  try{

    if(navigator.share){

      await navigator.share(shareData);

    }else{

      prompt("Copy Link:",url);

    }

  }catch(error){

    if(error.name !== "AbortError"){
      prompt("Copy Link:",url);
    }

  }

};


// =====================================
// RENDER SERIES
// =====================================

function render(filter="recent"){

  let items = [...SERIES];


  // RECENT
  if(filter === "recent"){

    items.sort((a,b) => b.latest_date - a.latest_date);

  }

  // TRENDING
  else if(filter === "trending"){

    items.sort((a,b) => b.total_views - a.total_views);

  }

  // OLDEST
  else if(filter === "oldest"){

    items.sort((a,b) => a.oldest_date - b.oldest_date);

  }


  // PAGINATION

  const totalPages = Math.ceil(items.length / ITEMS_PER_PAGE);

  const safeTotalPages = Math.max(1,totalPages);

  if(currentPage > safeTotalPages){
    currentPage = safeTotalPages;
  }

  const start = (currentPage - 1) * ITEMS_PER_PAGE;

  const paginated = items.slice(
    start,
    start + ITEMS_PER_PAGE
  );


  list.innerHTML = "";


  if(items.length === 0){

    list.innerHTML = "<p>No videos available.</p>";

  }


  // DISPLAY CARDS

  for(const series of paginated){

    const video = series.firstEpisode;

    if(!video) continue;

    const thumbnail = safeImage(video.thumbnail);

    const title = escapeHtml(series.series_title);

    const image = escapeHtml(thumbnail);

    const id = encodeURIComponent(video.id);

    const views = Number(series.total_views).toLocaleString();


    list.innerHTML += `

      <div class="card">

        <a href="Watch.html?id=${id}">

          <div class="thumb-container">

            <img
              class="thumb-bg"
              src="${image}"
              loading="lazy"
            />

            <img
              class="thumb-main"
              src="${image}"
              loading="lazy"
            />

          </div>

        </a>


        <div class="meta">

          <div class="title">
            ${title}
          </div>

          <div class="views">
            ${views} views
          </div>

        </div>


        <div class="actions">

          <a href="Watch.html?id=${id}">
            <button class="primary">Play</button>
          </a>

          <button
            class="share-btn"
            data-series="${escapeHtml(series.series_title)}"
          >
            Share
          </button>

        </div>

      </div>

    `;

  }


  // SHARE BUTTON EVENTS

  document.querySelectorAll(".share-btn").forEach(button => {

    button.addEventListener("click",() => {

      window.shareVideo(button.dataset.series);

    });

  });


  // PAGINATION

  pagination.innerHTML = `

    <div class="pagination">

      <button
        id="prevPage"
        ${currentPage === 1 ? "disabled" : ""}
      >
        ◀ Prev
      </button>

      <div class="page-info">
        Page ${currentPage} / ${safeTotalPages}
      </div>

      <button
        id="nextPage"
        ${currentPage >= safeTotalPages ? "disabled" : ""}
      >
        Next ▶
      </button>

    </div>

  `;


  document.getElementById("prevPage").onclick = () => {

    if(currentPage > 1){
      currentPage--;
      render(filter);
    }

  };


  document.getElementById("nextPage").onclick = () => {

    if(currentPage < safeTotalPages){
      currentPage++;
      render(filter);
    }

  };

}


// =====================================
// FILTER BUTTONS
// =====================================

document.querySelectorAll(".chip").forEach(chip => {

  chip.addEventListener("click",() => {

    document.querySelectorAll(".chip").forEach(c => {
      c.classList.remove("active");
    });

    chip.classList.add("active");

    currentPage = 1;

    render(chip.dataset.filter);

  });

});


// =====================================
// LOAD
// =====================================

fetchVideos();

</script>
