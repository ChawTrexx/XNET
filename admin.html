<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Teen18 - Series Admin</title>

<style>
*{box-sizing:border-box}

body{
    background:#0b0b0b;
    color:#fff;
    font-family:Arial,sans-serif;
    padding:15px;
}

.box{
    max-width:600px;
    margin:20px auto;
    background:#111;
    padding:20px;
    border-radius:12px;
    box-shadow:0 0 12px #000;
}

h2{
    text-align:center;
    color:#7062ff;
}

label{
    color:#aaa;
    font-size:13px;
}

input,textarea{
    width:100%;
    padding:12px;
    margin:9px 0 15px;
    border-radius:8px;
    border:1px solid #333;
    background:#1a1a1a;
    color:#fff;
    font-size:15px;
}

textarea{
    min-height:130px;
    resize:vertical;
}

button{
    padding:11px 16px;
    border:0;
    background:#5b4dff;
    color:#fff;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}

button:disabled{
    opacity:.5;
    cursor:not-allowed;
}

#upload{
    width:100%;
}

#result{
    color:#72ff7e;
    font-size:13px;
}

.section{
    max-width:700px;
    margin:30px auto;
}

.series-item{
    background:#171717;
    border:1px solid #292929;
    border-radius:10px;
    margin-bottom:12px;
    overflow:hidden;
}

.series-head{
    display:flex;
    align-items:center;
    gap:12px;
    padding:12px;
}

.series-head img{
    width:85px;
    height:65px;
    object-fit:cover;
    border-radius:7px;
}

.series-info{
    flex:1;
    min-width:0;
}

.series-info b{
    display:block;
    overflow-wrap:anywhere;
}

.series-info small{
    color:#aaa;
    line-height:1.8;
}

.series-actions{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
    margin-top:6px;
}

.series-actions button{
    font-size:11px;
    padding:7px 9px;
}

.delete-btn{
    background:#e53939;
}

.episode-list{
    display:none;
    padding:10px;
    border-top:1px solid #333;
}

.episode{
    display:flex;
    justify-content:space-between;
    gap:10px;
    align-items:center;
    padding:10px;
    margin:5px 0;
    background:#222;
    border-radius:7px;
    font-size:13px;
}

.empty{
    text-align:center;
    color:#888;
    padding:20px;
}

#status{
    text-align:center;
    color:#aaa;
    font-size:13px;
}

@media(max-width:450px){
    .series-head{
        align-items:flex-start;
    }
}
</style>
</head>

<body>

<div class="box">

<h2>🎬 Teen18 Series Upload</h2>

<label>Series Name</label>
<input id="series" placeholder="Example: Romantic Story">

<label>Upload Thumbnail</label>
<input type="file" id="imageUpload" accept="image/*">

<p id="result"></p>

<label>Thumbnail URL</label>
<input id="thumb" placeholder="Thumbnail URL">

<label>Video Links</label>
<textarea id="videos"
placeholder="Paste video links, one link per line

Example:
https://video1.mp4
https://video2.mp4
https://video3.mp4"></textarea>

<button id="upload">UPLOAD ALL EPISODES</button>

<p id="status"></p>

</div>


<div class="section">

<h2>📚 All Series</h2>

<div id="list">
<p class="empty">Loading series...</p>
</div>

</div>


<script type="module">

// =================================
// SUPABASE CONFIG
// =================================

const SUPABASE_URL =
"https://ukmhhpbnyjsgfmsmtiup.supabase.co";

const API_KEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVrbWhocGJueWpzZ2Ztc210aXVwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ2Nzg1NTgsImV4cCI6MjExMDI1NDU1OH0.ejrob-raOUdWAuuHxmLpbgPvWMyIW4paBQGp8zcAYds";

const IMGBB_KEY =
"51003ac5ab998ab8cca3e10be95e90eb";


const headers = {
    "apikey": API_KEY,
    "Authorization": `Bearer ${API_KEY}`
};


// =================================
// SAFE HTML
// =================================

function escapeHTML(value){
    return String(value ?? "").replace(/[&<>"']/g, c => ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#39;"
    })[c]);
}


// =================================
// THUMBNAIL UPLOAD
// =================================

async function uploadThumbnail(){

    const file =
    document.getElementById("imageUpload").files[0];

    if(!file) return;

    const result =
    document.getElementById("result");

    result.innerText = "Uploading thumbnail...";

    try{

        const form = new FormData();

        form.append("image",file);

        const response = await fetch(
            `https://api.imgbb.com/1/upload?key=${IMGBB_KEY}`,
            {
                method:"POST",
                body:form
            }
        );

        const data = await response.json();

        if(!response.ok || !data.success){
            throw new Error("Thumbnail upload failed");
        }

        document.getElementById("thumb").value =
        data.data.url;

        result.innerText = "✔ Thumbnail uploaded!";

    }catch(error){

        result.innerText = "❌ Thumbnail upload failed";

        console.error(error);
    }
}


document.getElementById("imageUpload")
.addEventListener("change",uploadThumbnail);


// =================================
// DROPBOX CONVERT
// =================================

function convertDropboxURL(url){

    try{

        if(url.includes("dropbox.com")){

            let u = new URL(url);

            u.searchParams.set("raw","1");

            u.searchParams.delete("dl");

            return u.toString();
        }

    }catch(e){}

    return url;
}


// =================================
// TERABOX CONVERT
// =================================

function convertTeraBoxURL(url){

    try{

        const match = url.match(
            /\/s\/([a-zA-Z0-9_-]+)/
        );

        if(match){

            return `https://terabox.beer/watch/${match[1]}`;
        }

    }catch(e){}

    return url;
}


// =================================
// IFRAME HELPERS
// =================================

function extractIframeSrc(iframe){

    const match = iframe.match(
        /src\s*=\s*["']([^"']+)["']/i
    );

    return match ? match[1] : null;
}


function makeSafeIframe(url){

    const safeURL = new URL(url);

    if(!["http:","https:"].includes(safeURL.protocol)){
        throw new Error("Invalid iframe URL");
    }

    return `<iframe
        src="${safeURL.href}"
        width="100%"
        height="100%"
        frameborder="0"
        scrolling="no"
        sandbox="allow-scripts allow-same-origin"
        allowfullscreen>
    </iframe>`;
}


// =================================
// DETECT VIDEO TYPE
// =================================

function detectType(input){

    input = input.trim();

    if(input.startsWith("<iframe")){

        const src = extractIframeSrc(input);

        if(!src){
            throw new Error("Invalid iframe");
        }

        return {
            type:"iframe",
            url:makeSafeIframe(src)
        };
    }


    if(
        input.includes("terabox.com") ||
        input.includes("1024terabox.com")
    ){

        return {
            type:"iframe",
            url:makeSafeIframe(convertTeraBoxURL(input))
        };
    }


    if(input.includes("dropbox.com")){

        return {
            type:"video",
            url:convertDropboxURL(input)
        };
    }


    const parsed = new URL(input);

    if(!["http:","https:"].includes(parsed.protocol)){
        throw new Error("Invalid video URL");
    }

    return {
        type:"video",
        url:input
    };
}


// =================================
// UPLOAD SERIES
// =================================

document.getElementById("upload")
.addEventListener("click",uploadSeries);


async function uploadSeries(){

    const series =
    document.getElementById("series").value.trim();

    const thumb =
    document.getElementById("thumb").value.trim();

    const videoText =
    document.getElementById("videos").value.trim();


    const links = videoText
    .split(/\r?\n/)
    .map(v=>v.trim())
    .filter(Boolean);


    if(!series || !thumb || !links.length){

        alert("Please fill all fields!");

        return;
    }


    const button =
    document.getElementById("upload");

    const status =
    document.getElementById("status");


    button.disabled = true;

    try{

        status.innerText = "Checking existing episodes...";


        // Find existing episodes of this series

        const check = await fetch(
            `${SUPABASE_URL}/rest/v1/videos?series_title=eq.${encodeURIComponent(series)}&select=episode_number&order=episode_number.desc&limit=1`,
            {headers}
        );

        if(!check.ok){
            throw new Error(await check.text());
        }

        const existing = await check.json();

        let episodeNumber =
        (existing[0]?.episode_number || 0) + 1;


        // Prepare all episodes

        const uploadData = links.map((link,index)=>{

            const detected = detectType(link);

            const ep = episodeNumber + index;

            return {

                title:`${series} EP ${ep}`,

                series_title:series,

                episode_number:ep,

                thumbnail:thumb,

                video_link:detected.url,

                type:detected.type,

                views:0

            };

        });


        // Upload all episodes in one request

        status.innerText =
        `Uploading ${uploadData.length} episodes...`;


        const response = await fetch(
            `${SUPABASE_URL}/rest/v1/videos`,
            {
                method:"POST",

                headers:{
                    ...headers,
                    "Content-Type":"application/json",
                    "Prefer":"return=representation"
                },

                body:JSON.stringify(uploadData)
            }
        );


        if(!response.ok){

            throw new Error(await response.text());
        }


        const uploaded = await response.json();


        status.innerText =
        `✔ ${uploaded.length} episodes uploaded successfully!`;


        alert(
            `Successfully uploaded ${uploaded.length} episodes!`
        );


        document.getElementById("series").value = "";

        document.getElementById("videos").value = "";

        document.getElementById("thumb").value = "";

        document.getElementById("imageUpload").value = "";

        document.getElementById("result").innerText = "";


        loadList();

    }catch(error){

        console.error(error);

        status.innerText = "❌ Upload failed";

        alert("Upload Error: " + error.message);

    }finally{

        button.disabled = false;
    }
}


// =================================
// LOAD SERIES
// =================================

async function loadList(){

    const list = document.getElementById("list");

    list.innerHTML =
    '<p class="empty">Loading...</p>';

    try{

        const response = await fetch(
            `${SUPABASE_URL}/rest/v1/videos?select=id,title,series_title,episode_number,thumbnail,views,type&order=created_at.desc`,
            {headers}
        );

        if(!response.ok){
            throw new Error(await response.text());
        }

        const data = await response.json();


        // Group videos by series

        const groups = {};

        data.forEach(v=>{

            const name = v.series_title || v.title;

            if(!groups[name]){
                groups[name] = [];
            }

            groups[name].push(v);

        });


        const seriesNames = Object.keys(groups);


        if(!seriesNames.length){

            list.innerHTML =
            '<p class="empty">No series uploaded yet.</p>';

            return;
        }


        list.innerHTML = "";


        seriesNames.forEach((name,index)=>{

            const episodes = groups[name];

            const totalViews = episodes.reduce(
                (sum,v)=>sum+Number(v.views||0),0
            );

            const thumbnail =
            episodes[0].thumbnail || "";


            const episodeHTML = episodes
            .sort((a,b)=>
                Number(a.episode_number||0) -
                Number(b.episode_number||0)
            )
            .map(v=>`

                <div class="episode">

                    <span>
                        ${escapeHTML(
                            v.title
                        )}
                        <br>
                        <small>
                            ${Number(v.views||0).toLocaleString()} views
                        </small>
                    </span>

                    <span>
                        EP ${v.episode_number || "-"}
                    </span>

                </div>

            `).join("");


            list.innerHTML += `

                <div class="series-item">

                    <div class="series-head">

                        <img
                            src="${escapeHTML(thumbnail)}"
                            onerror="this.src='https://placehold.co/85x65?text=No+Image'"
                        >

                        <div class="series-info">

                            <b>${escapeHTML(name)}</b>

                            <small>
                                ${episodes.length} Episodes
                                <br>
                                ${totalViews.toLocaleString()} Total Views
                            </small>

                            <div class="series-actions">

                                <button
                                    onclick="toggleEpisodes(${index})">
                                    VIEW EPISODES
                                </button>

                                <button
                                    class="delete-btn"
                                    onclick="deleteSeries(${JSON.stringify(name)})">
                                    DELETE SERIES
                                </button>

                            </div>

                        </div>

                    </div>

                    <div
                        class="episode-list"
                        id="episodes-${index}">

                        ${episodeHTML}

                    </div>

                </div>

            `;

        });

    }catch(error){

        console.error(error);

        list.innerHTML =
        '<p class="empty">Error loading series.</p>';

    }
}


// =================================
// TOGGLE EPISODES
// =================================

window.toggleEpisodes = function(index){

    const box =
    document.getElementById(`episodes-${index}`);

    box.style.display =
    box.style.display === "block"
    ? "none"
    : "block";

};


// =================================
// DELETE COMPLETE SERIES
// =================================

window.deleteSeries = async function(name){

    const confirmDelete = confirm(
        `DELETE COMPLETE SERIES?\n\n${name}\n\nAll episodes and their comments will be deleted permanently!`
    );

    if(!confirmDelete) return;


    try{

        const response = await fetch(
            `${SUPABASE_URL}/rest/v1/videos?series_title=eq.${encodeURIComponent(name)}`,
            {
                method:"DELETE",
                headers:{
                    ...headers,
                    "Prefer":"return=minimal"
                }
            }
        );


        if(!response.ok){

            throw new Error(await response.text());
        }


        alert("✔ Series deleted successfully!");

        loadList();

    }catch(error){

        console.error(error);

        alert("Delete failed: " + error.message);

    }

};


// =================================
// INITIALIZE
// =================================

loadList();

</script>

</body>
</html>
