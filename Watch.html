body{

/* HEADER */

header{

.episode-controls select{
  flex:1;

.episode-count{

.recommend-item img{

/* COMMENT PREVIEW */

  justify-content:space-between;

.close-btn{

.comments-list{
  overflow-y:auto;

.comment-item{

  padding:10px;

  margin:8px 0;
}

.comment-item .user{
  font-size:14px;
  color:var(--accent);
  margin-bottom:5px;
}

.comment-input-box{
  display:flex;

}

.comment-input-box input{
  flex:1;
  min-width:0;
  padding:10px;
  background:#000;

.comment-input-box button{

::-webkit-scrollbar{

<script type="module" src="https://cdn.jsdelivr.net/npm/@videojs/html/cdn/video.js"></script>


<script type="module">

// =====================================
// SUPABASE CONFIG
// =====================================

const SUPABASE_URL = "https://ukmhhpbnyjsgfmsmtiup.supabase.co";

const API_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVrbWhocGJueWpzZ2Ztc210aXVwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ2Nzg1NTgsImV4cCI6MjExMDI1NDU1OH0.ejrob-raOUdWAuuHxmLpbgPvWMyIW4paBQGp8zcAYds";

const HEADERS = {
  "apikey":API_KEY,
  "Authorization":"Bearer "+API_KEY
};


// =====================================
// CURRENT VIDEO ID
// =====================================

const rawId = new URLSearchParams(location.search).get("id");

const videoId = rawId && /^\d+$/.test(rawId)
  ? Number(rawId)
  : null;


let CURRENT_VIDEO = null;
let EPISODES = [];
let RECOMMENDATIONS = [];


// =====================================
// HELPERS
// =====================================

function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function safeUrl(value){

  try{

    const url = new URL(value);

    if(url.protocol === "https:" || url.protocol === "http:"){
      return url.href;
    }

  }catch(e){}

  return "";

}


async function supabaseFetch(url,options={}){

  const response = await fetch(
    `${SUPABASE_URL}/rest/v1/${url}`,
    {
      ...options,
      headers:{
        ...HEADERS,
        ...(options.headers || {})
      }
    }
  );

  if(!response.ok){
    throw new Error(await response.text());
  }

  return response;

}


// =====================================
// VIDEO PLAYER
// =====================================

function renderVideo(video){

  const link = (video.video_link || "").trim();

  // IFRAME SUPPORT

  if(
    link.startsWith("<iframe") &&
    link.includes("sandbox")
  ){

    return link;

  }


  // NORMAL VIDEO URL

  const safeLink = safeUrl(link);

  if(safeLink){

    return `

      <video-player>

        <video-skin>

          <video
            src="${escapeHtml(safeLink)}"
            controls
            playsinline
            preload="metadata">
          </video>

        </video-skin>

      </video-player>

    `;

  }


  return `<p style="color:red;">Invalid Video Link</p>`;

}


// =====================================
// LOAD CURRENT VIDEO
// =====================================

async function loadVideo(){

  if(!videoId){

    document.getElementById("vtitle").innerText =
      "No Video ID provided!";

    return;

  }


  try{

    const res = await supabaseFetch(
      `videos?id=eq.${videoId}&select=*`
    );

    const data = await res.json();

    if(!data.length){

      document.getElementById("vtitle").innerText =
        "Video Not Found!";

      return;

    }


    CURRENT_VIDEO = data[0];


    // VIDEO PLAYER

    document.getElementById("player").innerHTML =
      renderVideo(CURRENT_VIDEO);


    document.getElementById("vtitle").innerText =
      CURRENT_VIDEO.title || "";


    // EPISODE VIEWS UPDATE

    await incrementViews();


    // DISPLAY VIEWS

    const currentViews =
      Number(CURRENT_VIDEO.views || 0) + 1;

    document.getElementById("vmeta").innerText =
      `${currentViews.toLocaleString()} episode views`;


    // SERIES TITLE

    document.getElementById("seriesTitle").innerText =
      CURRENT_VIDEO.series_title || CURRENT_VIDEO.title;


    // LOAD SERIES EPISODES

    await loadEpisodes();


  }catch(error){

    console.error(error);

    document.getElementById("vtitle").innerText =
      "Unable to load video.";

  }

}


// =====================================
// ATOMIC VIDEO VIEWS
// SQL RPC FUNCTION
// =====================================

async function incrementViews(){

  try{

    const response = await supabaseFetch(
      "rpc/increment_video_views",
      {
        method:"POST",
        headers:{
          "Content-Type":"application/json"
        },
        body:JSON.stringify({
          video_id:videoId
        })
      }
    );

    const updatedViews = await response.json();

    CURRENT_VIDEO.views = Number(updatedViews);

  }catch(error){

    console.error("Views update failed:",error);

  }

}


// =====================================
// LOAD SERIES EPISODES
// =====================================

async function loadEpisodes(){

  const select = document.getElementById("episodeSelect");

  const previousButton = document.getElementById("prevEpisode");

  const nextButton = document.getElementById("nextEpisode");


  try{

    let query;


    if(CURRENT_VIDEO.series_title){

      const params = new URLSearchParams();

      params.set("select","id,title,episode_number,views,thumbnail,created_at");

      params.set("series_title",`eq.${CURRENT_VIDEO.series_title}`);

      params.set("order","episode_number.asc.nullslast,created_at.asc");

      query = "videos?" + params.toString();

    }else{

      query =
        `videos?id=eq.${videoId}&select=id,title,episode_number,views,thumbnail,created_at`;

    }


    const res = await supabaseFetch(query);

    EPISODES = await res.json();


    // FALLBACK

    if(!EPISODES.length){
      EPISODES = [CURRENT_VIDEO];
    }


    // EPISODE DROPDOWN

    select.innerHTML = "";


    EPISODES.forEach((episode,index)=>{

      const option = document.createElement("option");

      option.value = episode.id;

      option.textContent =
        episode.episode_number
          ? `EP ${episode.episode_number}`
          : episode.title;

      if(episode.id == videoId){
        option.selected = true;
      }

      select.appendChild(option);

    });


    // FIND CURRENT INDEX

    const currentIndex = EPISODES.findIndex(
      ep => ep.id == videoId
    );


    previousButton.disabled = currentIndex <= 0;

    nextButton.disabled =
      currentIndex === -1 ||
      currentIndex >= EPISODES.length - 1;


    document.getElementById("episodeCount").innerText =
      `Episode ${currentIndex + 1} of ${EPISODES.length}`;


    previousButton.onclick = ()=>{

      if(currentIndex > 0){

        openEpisode(EPISODES[currentIndex - 1].id);

      }

    };


    nextButton.onclick = ()=>{

      if(currentIndex < EPISODES.length - 1){

        openEpisode(EPISODES[currentIndex + 1].id);

      }

    };


    select.onchange = ()=>{

      openEpisode(select.value);

    };


  }catch(error){

    console.error("Episode loading error:",error);

  }

}


// =====================================
// OPEN EPISODE
// =====================================

function openEpisode(id){

  if(!id) return;

  location.href = `Watch.html?id=${encodeURIComponent(id)}`;

}


// =====================================
// LOAD RECOMMENDED SERIES
// =====================================

async function loadRecommended(){

  const box = document.getElementById("recommended");

  try{

    const params = new URLSearchParams();

    params.set(
      "select",
      "id,title,series_title,episode_number,thumbnail,views,created_at"
    );

    params.set("not.is.null","");

    params.set("order","views.desc");

    params.set("limit","300");


    const res = await supabaseFetch(
      "videos?"+params.toString()
    );

    const data = await res.json();


    // GROUP BY SERIES

    const groups = {};


    data.forEach(video=>{

      const name = (
        video.series_title ||
        video.title ||
        "Untitled"
      ).trim();


      if(
        CURRENT_VIDEO &&
        name === (
          CURRENT_VIDEO.series_title ||
          CURRENT_VIDEO.title
        )
      ){
        return;
      }


      if(!groups[name]){

        groups[name] = {
          name:name,
          episodes:[],
          totalViews:0
        };

      }


      groups[name].episodes.push(video);

      groups[name].totalViews +=
        Number(video.views || 0);

    });


    const seriesList = Object.values(groups);


    // SORT BY TOTAL VIEWS

    seriesList.sort(
      (a,b)=>b.totalViews-a.totalViews
    );


    box.innerHTML = "";


    seriesList.slice(0,30).forEach(series=>{

      // EPISODE 1 FIRST

      series.episodes.sort((a,b)=>{

        return Number(a.episode_number || 999999) -
               Number(b.episode_number || 999999);

      });


      const firstEpisode =
        series.episodes.find(
          ep=>Number(ep.episode_number)===1
        ) || series.episodes[0];


      const thumb = safeUrl(firstEpisode.thumbnail);


      const item = document.createElement("div");

      item.className = "recommend-item";


      const image = document.createElement("img");

      image.src = thumb || "default.jpg";

      image.loading = "lazy";


      const info = document.createElement("div");

      const title = document.createElement("b");

      title.textContent = series.name;


      const details = document.createElement("small");

      details.textContent =
        `${series.totalViews.toLocaleString()} views • ${series.episodes.length} episodes`;


      info.appendChild(title);

      info.appendChild(document.createElement("br"));

      info.appendChild(details);


      item.appendChild(image);

      item.appendChild(info);


      item.addEventListener("click",()=>{

        openEpisode(firstEpisode.id);

      });


      box.appendChild(item);

    });


  }catch(error){

    console.error("Recommendation error:",error);

    box.innerHTML = "";

  }

}


// =====================================
// COMMENT SYSTEM
// =====================================

// RANDOM USERNAME

if(!localStorage.getItem("userName")){

  localStorage.setItem(
    "userName",
    "User"+Math.floor(Math.random()*9999)
  );

}

const username = localStorage.getItem("userName");


// OPEN / CLOSE COMMENTS

window.openComments = ()=>{

  document.getElementById("commentPanel").style.bottom="0";

};


window.closeComments = ()=>{

  document.getElementById("commentPanel").style.bottom="-100%";

};


// =====================================
// SEND COMMENT
// =====================================

window.sendComment = async ()=>{

  const textInput =
    document.getElementById("commentText");

  const text = textInput.value.trim();


  if(!text || !videoId) return;


  try{

    await supabaseFetch(
      "comments",
      {
        method:"POST",
        headers:{
          "Content-Type":"application/json",
          "Prefer":"return=minimal"
        },
        body:JSON.stringify({

          video_id:videoId,

          user_name:username,

          content:text

        })
      }
    );


    textInput.value = "";

    loadComments();


  }catch(error){

    console.error(error);

    alert("Error posting comment!");

  }

};


// =====================================
// LOAD COMMENTS
// =====================================

async function loadComments(){

  if(!videoId) return;


  try{

    const params = new URLSearchParams();

    params.set("video_id",`eq.${videoId}`);

    params.set("select","*");

    params.set("order","created_at.desc");

    params.set("limit","200");


    const res = await supabaseFetch(
      "comments?"+params.toString()
    );

    const data = await res.json();


    const list =
      document.getElementById("commentsList");

    list.innerHTML = "";


    document.getElementById("commentCount").innerText =
      data.length;


    document.getElementById("latestComment").innerText =
      data[0]
        ? data[0].content
        : "No comments yet...";


    data.forEach(comment=>{

      const item = document.createElement("div");

      item.className = "comment-item";


      const user = document.createElement("div");

      user.className = "user";

      user.textContent = "⭐ "+comment.user_name;


      const content = document.createElement("div");

      content.style.wordWrap = "break-word";

      content.textContent = comment.content;


      item.appendChild(user);

      item.appendChild(content);

      list.appendChild(item);

    });


  }catch(error){

    console.error("Comments loading error:",error);

  }

}


// =====================================
// INITIALIZATION
// =====================================

await loadVideo();

loadComments();

loadRecommended();

</script>
